name: Build APK 1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build latest RemSubs APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Find next workflow number
        id: next
        shell: bash
        run: |
          max=0

          for file in .github/workflows/build-apk-*.yml .github/workflows/build-apk-*.yaml; do
            [ -e "$file" ] || continue

            name=$(basename "$file")
            number=$(echo "$name" | sed -E 's/^build-apk-([0-9]+)\.(yml|yaml)$/\1/')

            if [[ "$number" =~ ^[0-9]+$ ]] && [ "$number" -gt "$max" ]; then
              max="$number"
            fi
          done

          next=$((max + 1))

          echo "next_number=$next" >> "$GITHUB_OUTPUT"
          echo "next_file=.github/workflows/build-apk-$next.yml" >> "$GITHUB_OUTPUT"

          echo "Next workflow: build-apk-$next.yml"

      - name: Copy this workflow with next number
        shell: bash
        run: |
          NEXT_FILE="${{ steps.next.outputs.next_file }}"

          cp ".github/workflows/build-apk-1.yml" "$NEXT_FILE"

          sed -i \
            "s/name: Build APK 1/name: Build APK ${{ steps.next.outputs.next_number }}/" \
            "$NEXT_FILE"

      - name: Commit next workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ".github/workflows/build-apk-${{ steps.next.outputs.next_number }}.yml"

          git commit \
            -m "Add build workflow ${{ steps.next.outputs.next_number }}" \
            || echo "Nothing to commit"

          git push

      - name: Remove workflow files from build workspace
        shell: bash
        run: |
          rm -rf .github/workflows

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemSubs-APK-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7