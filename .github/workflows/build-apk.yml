name: Build RemSubs APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Latest APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # main branch'in EN GÜNCEL halini al
      - name: Checkout latest repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      # Workflow dosyalarını build kaynaklarından çıkar
      # Böylece .github/workflows içindeki hiçbir dosya
      # APK build sürecine dahil olmaz.
      - name: Remove workflow files
        shell: bash
        run: |
          rm -rf .github/workflows

      # Java
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      # Debug signing
      - name: Create debug keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # APK build
      - name: Build APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # APK kontrolü
      - name: Verify APK
        shell: bash
        run: |
          echo "Generated APK:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      # APK'yı indirilebilir Artifact yap
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemSubs-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7